<!doctype html>
<html>
  <head>
    <title>AR Tata Surya</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #121212;
      }
      .top-bar {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 8px 25px;
        border-radius: 50px;
        z-index: 999;
        font-size: 13px;
        text-align: center;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div class="top-bar">
      Arahkan kamera ke marker Hiro, lalu geser layar untuk melihat dari
      berbagai sudut
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; precision: high; antialias: true;"
      vr-mode-ui="enabled: false"
    >
      <a-entity light="type: ambient; intensity: 2.0;"></a-entity>
      <a-entity
        light="type: directional; intensity: 1.0;"
        position="1 3 2"
      ></a-entity>

      <a-marker preset="hiro">
        <!-- Ganti nama file GLB di bawah ini. Ubah scale jika model terlalu besar/kecil -->
        <a-entity id="group-model" scale="0.08 0.08 0.08" rotation="0 0 0">
          <a-entity
            gltf-model="url(./tatasurya.glb)"
            position="0 0 0"
          ></a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Geser jari (atau mouse) untuk memutar model dari berbagai sudut
      var group = document.getElementById("group-model");
      var dragging = false,
        lastX = 0,
        lastY = 0;

      function mulai(x, y) {
        dragging = true;
        lastX = x;
        lastY = y;
      }
      function geser(x, y) {
        if (!dragging) return;
        var rot = group.getAttribute("rotation");
        group.setAttribute("rotation", {
          x: rot.x + (y - lastY) * 0.5,
          y: rot.y + (x - lastX) * 0.5,
          z: rot.z,
        });
        lastX = x;
        lastY = y;
      }
      function selesai() {
        dragging = false;
      }

      window.addEventListener("touchstart", function (e) {
        mulai(e.touches[0].clientX, e.touches[0].clientY);
      });
      window.addEventListener("touchmove", function (e) {
        geser(e.touches[0].clientX, e.touches[0].clientY);
      });
      window.addEventListener("touchend", selesai);
      window.addEventListener("mousedown", function (e) {
        mulai(e.clientX, e.clientY);
      });
      window.addEventListener("mousemove", function (e) {
        geser(e.clientX, e.clientY);
      });
      window.addEventListener("mouseup", selesai);
    </script>
  </body>
</html>
