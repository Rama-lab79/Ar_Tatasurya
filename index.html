<!doctype html>
<html>
  <head>
    <title>Tes Marker</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #status {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 8px 20px;
        border-radius: 50px;
        z-index: 999;
        font-size: 13px;
        font-family: sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="status">Arahkan kamera ke marker Hiro</div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
      renderer="logarithmicDepthBuffer: true; precision: high; antialias: true;"
      vr-mode-ui="enabled: false"
    >
      <a-entity light="type: ambient; intensity: 2.0;"></a-entity>
      <a-marker preset="hiro" id="marker-hiro">
        <a-box position="0 0.5 0" color="red" scale="1 1 1"></a-box>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>

    <script>
      var s = document.getElementById("status");
      var m = document.getElementById("marker-hiro");
      m.addEventListener("markerFound", function () {
        s.innerText = "MARKER TERDETEKSI";
      });
      m.addEventListener("markerLost", function () {
        s.innerText = "Arahkan kamera ke marker Hiro";
      });
    </script>
  </body>
</html>
